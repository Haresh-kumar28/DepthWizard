version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DEPTHWIZARD_DATA_DIR=/app/data
      - DEPTHWIZARD_MODELS_DIR=/app/models
      - DEPTHWIZARD_DEVICE=cpu
    deploy:
      resources:
        limits:
          memory: 8G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
